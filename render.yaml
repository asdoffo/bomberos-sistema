# Blueprint de Render (capa gratuita): servicio web + PostgreSQL.
# En Render: New > Blueprint > elegir este repositorio.
databases:
  - name: bomberos-db
    plan: free
    databaseName: bomberos
    user: bomberos

services:
  - type: web
    name: bomberos-sistema
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: bomberos-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
